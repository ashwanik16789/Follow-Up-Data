<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#f4f6fa;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px}
.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}
.login{min-height:100vh;display:grid;place-items:center;background:#111827}.login .box{background:#fff;padding:30px;border-radius:14px;width:min(380px,92%);box-shadow:0 15px 45px #0004}
.app{display:flex;min-height:100vh}.side{width:230px;background:#111827;color:#d1d5db;padding:20px;flex-shrink:0}.side h2{color:#fff}.side button{display:block;width:100%;text-align:left;background:transparent;color:#d1d5db;margin:5px 0}.side button:hover,.side button.active{background:#263244;color:#fff}
.main{flex:1;padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:18px}.card b{font-size:28px;display:block;margin-top:7px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left}th{background:#f8fafc}
input,select,textarea{width:100%;padding:10px;border:1px solid #d8dde6;border-radius:8px;margin:5px 0 12px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.won{background:#dcfce7}.follow{background:#fef3c7}.lost{background:#fee2e2}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modal>div{background:#fff;padding:24px;border-radius:14px;width:min(700px,95%);max-height:92vh;overflow:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#667085}.ok{color:#15803d}.warn{color:#b45309}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.side{width:190px}}
</style>
</head>
<body><div id="root"></div>
<script>
/*
  1) Create a Supabase project.
  2) Replace SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY below.
  3) Run schema.sql in Supabase SQL Editor.
*/
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const sb=(SUPABASE_URL.startsWith("http")&&SUPABASE_PUBLISHABLE_KEY.startsWith("ey"))
  ? supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;

let session=null, profile=null, screen="dashboard";

const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function boot(){
  if(!sb){showSetup();return}
  const {data:{session:s}}=await sb.auth.getSession();
  session=s;
  if(session) await loadProfile();
  render();
  sb.auth.onAuthStateChange(async (_e,s)=>{session=s;if(s) await loadProfile();else profile=null;render()});
}
function showSetup(){
 root.innerHTML=`<div class="login"><div class="box">
 <h1>Sales CRM</h1><p>GitHub + Supabase setup is not connected yet.</p>
 <p class="muted">Open <b>README.md</b> and follow the 3 setup steps, then replace the two configuration values in index.html.</p>
 </div></div>`;
}
async function loadProfile(){
 const {data,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
 if(error){alert("Profile not found. Ask the manager to create/approve your user.");await sb.auth.signOut({scope:"local"});return}
 profile=data;
}
async function login(){
 const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error) alert(error.message);
}
async function logout(){await sb.auth.signOut({scope:"local"})}
function go(x){screen=x;render()}
function render(){
 if(!session||!profile){root.innerHTML=`<div class="login"><div class="box"><h1>Sales CRM</h1><p class="muted">Team Sales & Pipeline</p>
 <label>Email</label><input id="email" type="email" placeholder="agent@company.com">
 <label>Password</label><input id="password" type="password">
 <button class="primary" style="width:100%" onclick="login()">Login</button>
 </div></div>`;return}
 const menus=[["dashboard","🏠 Dashboard"],["leads",profile.role==="manager"?"👥 All Leads":"👥 My Leads"],["followups","📞 Follow-ups"],["pipeline","📊 Pipeline"],["sales","💰 Sales"]];
 if(profile.role==="manager")menus.push(["reports","📑 Reports"],["settings","⚙️ Settings"]);
 root.innerHTML=`<div class="app"><aside class="side"><h2>Sales CRM</h2><p>${esc(profile.full_name)}<br><small>${profile.role}</small></p>
 ${menus.map(m=>`<button class="${screen===m[0]?"active":""}" onclick="go('${m[0]}')">${m[1]}</button>`).join("")}
 <hr><button onclick="logout()">↪ Logout</button></aside><main class="main"><div class="top"><div><h1 style="margin:0">${screenName()}</h1><span class="muted">${today()}</span></div>${screen==="leads"?'<button class="primary" onclick="leadForm()">+ Add Lead</button>':""}</div>${page()}</main></div>`;
}
function screenName(){return ({dashboard:"Dashboard",leads:profile.role==="manager"?"All Leads":"My Leads",followups:"Follow-ups",pipeline:"Sales Pipeline",sales:"Sales",reports:"Reports",settings:"Settings"})[screen]}
function page(){if(screen==="dashboard")return dashboard();if(screen==="leads")return leadsPage();if(screen==="followups")return followups();if(screen==="pipeline")return pipeline();if(screen==="sales")return salesPage();if(screen==="reports")return reports();return settings()}

async function getLeads(){
 let q=sb.from("leads").select("*,profiles:agent_id(full_name)").order("created_at",{ascending:false});
 if(profile.role!=="manager")q=q.eq("agent_id",profile.id);
 const {data,error}=await q;if(error){alert(error.message);return []}return data||[];
}
async function getSales(){
 let q=sb.from("sales").select("*,profiles:agent_id(full_name)").order("sold_at",{ascending:false});
 if(profile.role!=="manager")q=q.eq("agent_id",profile.id);
 const {data,error}=await q;if(error){alert(error.message);return []}return data||[];
}
function dashboard(){
 return `<div id="dash"><p class="muted">Loading live data…</p></div>`;
}
async function fillDashboard(){
 const [ls,ss]=await Promise.all([getLeads(),getSales()]);
 const revenue=ss.reduce((a,s)=>a+Number(s.final_price),0),disc=ss.reduce((a,s)=>a+Number(s.discount_amount),0);
 const todaySales=ss.filter(s=>String(s.sold_at).slice(0,10)===today()).length;
 let html=`<div class="cards"><div class="card">Leads<b>${ls.length}</b></div><div class="card">Today's Sales<b>${todaySales}</b></div><div class="card">Revenue<b>${money(revenue)}</b></div><div class="card">Discount Given<b>${money(disc)}</b></div></div>
 <div class="panel"><h3>Today's Target</h3><b>${todaySales} / ${profile.daily_target||10} sales</b></div>`;
 if(profile.role==="manager"){
  const agents=await sb.from("profiles").select("id,full_name").eq("role","agent").eq("active",true);
  html+=`<div class="panel"><h3>Team Performance</h3><table><tr><th>Agent</th><th>Leads</th><th>Sales</th><th>Revenue</th></tr>${(agents.data||[]).map(a=>{let al=ls.filter(x=>x.agent_id===a.id),as=ss.filter(x=>x.agent_id===a.id);return `<tr><td>${esc(a.full_name)}</td><td>${al.length}</td><td><b>${as.length}</b></td><td>${money(as.reduce((z,x)=>z+Number(x.final_price),0))}</td></tr>`}).join("")}</table></div>`;
 }
 document.getElementById("dash").innerHTML=html;
}
function leadsPage(){setTimeout(async()=>{document.getElementById("leadbox").innerHTML=leadTable(await getLeads())},0);return `<div class="panel"><div id="leadbox">Loading…</div></div>`}
function leadTable(ls){return `<table><tr><th>Customer</th><th>Mobile</th><th>Agent</th><th>Membership</th><th>Status</th><th>Follow-up</th><th></th></tr>${ls.map(l=>`<tr><td><b>${esc(l.customer_name)}</b><br><small>${esc(l.email||"")}</small></td><td>${esc(l.mobile)}</td><td>${esc(l.profiles?.full_name||"")}</td><td>${esc(l.membership||"")}</td><td><span class="badge ${l.status==="Won"?"won":l.status==="Lost"?"lost":l.status==="Follow-up"?"follow":""}">${esc(l.status)}</span></td><td>${esc(l.next_followup||"—")}</td><td><button onclick="leadForm('${l.id}')">Open</button></td></tr>`).join("")}</table>`}
async function leadForm(id){
 let l=null;if(id){const {data}=await sb.from("leads").select("*").eq("id",id).single();l=data}
 let agents=[];if(profile.role==="manager"){const r=await sb.from("profiles").select("id,full_name").eq("role","agent").eq("active",true);agents=r.data||[]}
 showModal(`<h2>${id?"Edit":"Add"} Lead</h2><div class="grid">
 <div><label>Customer Name*</label><input id="f_name" value="${esc(l?.customer_name||"")}"></div>
 <div><label>Mobile*</label><input id="f_mobile" value="${esc(l?.mobile||"")}"></div>
 <div><label>Email</label><input id="f_email" value="${esc(l?.email||"")}"></div>
 <div><label>Membership</label><select id="f_membership">${["White","Black","Orange","Other"].map(x=>`<option ${l?.membership===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label>Lead Source</label><input id="f_source" value="${esc(l?.source||"")}"></div>
 <div><label>Priority</label><select id="f_priority">${["Hot","Warm","Cold"].map(x=>`<option ${l?.priority===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label>Status</label><select id="f_status">${["New","Contacted","Interested","Follow-up","Negotiation","Won","Lost","No Answer","Not Interested"].map(x=>`<option ${l?.status===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label>Next Follow-up</label><input id="f_followup" type="date" value="${esc(l?.next_followup||"")}"></div>
 </div><label>Remarks</label><textarea id="f_remarks">${esc(l?.remarks||"")}</textarea>
 ${profile.role==="manager"?`<label>Assigned Agent</label><select id="f_agent">${agents.map(a=>`<option value="${a.id}" ${l?.agent_id===a.id?"selected":""}>${esc(a.full_name)}</option>`).join("")}</select>`:""}
 <button class="primary" onclick="saveLead('${id||""}')">Save Lead</button> ${id?`<button onclick="saleForm('${id}')">Convert to Sale</button>`:""} <button onclick="closeModal()">Cancel</button>`);
}
async function saveLead(id){
 const payload={customer_name:f_name.value.trim(),mobile:f_mobile.value.trim(),email:f_email.value.trim()||null,membership:f_membership.value,source:f_source.value.trim()||null,priority:f_priority.value,status:f_status.value,next_followup:f_followup.value||null,remarks:f_remarks.value.trim()||null};
 if(profile.role==="manager")payload.agent_id=f_agent.value;else payload.agent_id=profile.id;
 if(!payload.customer_name||!payload.mobile)return alert("Name and mobile are required");
 const r=id?await sb.from("leads").update(payload).eq("id",id):await sb.from("leads").insert(payload);
 if(r.error)return alert(r.error.message);
 closeModal();render();
}
async function followups(){
 const ls=await getLeads();return `<div class="panel"><table><tr><th>Customer</th><th>Agent</th><th>Follow-up</th><th>Status</th><th></th></tr>${ls.filter(l=>l.next_followup).sort((a,b)=>String(a.next_followup).localeCompare(String(b.next_followup))).map(l=>`<tr><td>${esc(l.customer_name)}</td><td>${esc(l.profiles?.full_name||"")}</td><td>${esc(l.next_followup)} ${l.next_followup<today()?'<b class="warn">OVERDUE</b>':""}</td><td>${esc(l.status)}</td><td><button onclick="leadForm('${l.id}')">Update</button></td></tr>`).join("")}</table></div>`;
}
function followups(){const el=`<div id="followbox" class="panel">Loading…</div>`;setTimeout(async()=>{document.getElementById("followbox").outerHTML=await followupsAsync()},0);return el}
async function followupsAsync(){return await followupsReal()}
async function followupsReal(){const ls=await getLeads();return `<div id="followbox" class="panel"><table><tr><th>Customer</th><th>Agent</th><th>Follow-up</th><th>Status</th><th></th></tr>${ls.filter(l=>l.next_followup).map(l=>`<tr><td>${esc(l.customer_name)}</td><td>${esc(l.profiles?.full_name||"")}</td><td>${esc(l.next_followup)}</td><td>${esc(l.status)}</td><td><button onclick="leadForm('${l.id}')">Update</button></td></tr>`).join("")}</table></div>`}
async function pipeline(){const ls=await getLeads(),st=["New","Contacted","Interested","Follow-up","Negotiation","Won","Lost"];return `<div class="cards">${st.map(s=>`<div class="card">${s}<b>${ls.filter(l=>l.status===s).length}</b></div>`).join("")}</div>`}
function pipeline(){const el=`<div id="pipe" class="cards">Loading…</div>`;setTimeout(async()=>{const ls=await getLeads(),st=["New","Contacted","Interested","Follow-up","Negotiation","Won","Lost"];document.getElementById("pipe").innerHTML=st.map(s=>`<div class="card">${s}<b>${ls.filter(l=>l.status===s).length}</b></div>`).join("")},0);return el}
async function salesPage(){const el=`<div id="salesbox" class="panel">Loading…</div>`;setTimeout(async()=>{const ss=await getSales();document.getElementById("salesbox").innerHTML=`<table><tr><th>Date</th><th>Customer</th><th>Agent</th><th>Membership</th><th>MRP</th><th>Discount</th><th>Final</th></tr>${ss.map(s=>`<tr><td>${String(s.sold_at).slice(0,10)}</td><td>${esc(s.customer_name)}</td><td>${esc(s.profiles?.full_name||"")}</td><td>${esc(s.membership)}</td><td>${money(s.mrp)}</td><td>${money(s.discount_amount)} (${s.discount_pct}%)</td><td><b>${money(s.final_price)}</b></td></tr>`).join("")}</table>`},0);return el}
function salesPage(){return `<div id="salesbox" class="panel">Loading…</div>`}
async function saleForm(id){
 const {data:l}=await sb.from("leads").select("*").eq("id",id).single();
 showModal(`<h2>Convert to Sale</h2><p><b>${esc(l.customer_name)}</b></p><div class="grid"><div><label>MRP</label><input id="s_mrp" type="number" value="8000" oninput="calcSale()"></div><div><label>Discount ₹</label><input id="s_discount" type="number" value="0" oninput="calcSale()"></div></div><p>Discount: <b id="s_pct">0%</b> · Final: <b id="s_final">₹8,000</b></p><label>Payment Status</label><select id="s_payment"><option>Paid</option><option>Pending</option></select><label>Payment Mode</label><select id="s_mode"><option>Online</option><option>UPI</option><option>Card</option><option>Cash</option><option>Other</option></select><button class="primary" onclick="saveSale('${id}')">Confirm Sale</button> <button onclick="closeModal()">Cancel</button>`);
}
function calcSale(){const m=+s_mrp.value||0,d=+s_discount.value||0;s_pct.textContent=(m?d/m*100:0).toFixed(2)+"%";s_final.textContent=money(m-d)}
async function saveSale(id){
 const {data:l}=await sb.from("leads").select("*").eq("id",id).single(),m=+s_mrp.value||0,d=+s_discount.value||0;
 if(d>m)return alert("Discount cannot exceed MRP");
 const r=await sb.from("sales").insert({lead_id:id,agent_id:l.agent_id,customer_name:l.customer_name,membership:l.membership,mrp:m,discount_amount:d,discount_pct:m?d/m*100:0,final_price:m-d,payment_status:s_payment.value,payment_mode:s_mode.value});
 if(r.error)return alert(r.error.message);
 await sb.from("leads").update({status:"Won",next_followup:null}).eq("id",id);
 closeModal();render();
}
function reports(){const el=`<div id="rep" class="cards">Loading…</div>`;setTimeout(async()=>{const [l,s]=await Promise.all([getLeads(),getSales()]);document.getElementById("rep").innerHTML=`<div class="card">Total Leads<b>${l.length}</b></div><div class="card">Sales<b>${s.length}</b></div><div class="card">Revenue<b>${money(s.reduce((a,x)=>a+Number(x.final_price),0))}</b></div><div class="card">Discount<b>${money(s.reduce((a,x)=>a+Number(x.discount_amount),0))}</b></div>`},0);return el}
function settings(){return `<div class="panel"><h3>Manager Settings</h3><p>Daily target and team-user administration should be managed in Supabase. The database policies already restrict agents to their own leads/sales and managers to the full team.</p><p class="muted">For production, keep the repository private if your GitHub plan permits it and never put a service-role key in this file.</p></div>`}
function showModal(html){const d=document.createElement("div");d.id="modal";d.className="modal";d.innerHTML="<div>"+html+"</div>";document.body.appendChild(d)}
function closeModal(){document.getElementById("modal")?.remove()}
window.login=login;window.logout=logout;window.go=go;window.leadForm=leadForm;window.saveLead=saveLead;window.saleForm=saleForm;window.saveSale=saveSale;window.calcSale=calcSale;window.closeModal=closeModal;
boot();
</script></body></html>
